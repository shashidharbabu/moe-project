model:
  type: "MLP"
  layers:
    - input_dim: 768
      output_dim: 512
      activation: "GELU"
      dropout: 0.1
    - output_dim: 3
      activation: "Softmax"
  
training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  optimizer: "Adam"
  loss_function: "CrossEntropyLoss"
  
data:
  dataset: "combined"
  image_size: [512, 512]
  augmentation:
    - type: "RandomHorizontalFlip"
    - type: "RandomRotation"
      degrees: 15

logging:
  log_interval: 10
  save_model: true
  model_save_path: "models/router_teacher.pt"