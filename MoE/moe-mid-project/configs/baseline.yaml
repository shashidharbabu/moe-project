model:
  name: stable-diffusion-v1-5
  pretrained: true
  num_epochs: 10
  learning_rate: 1e-5
  batch_size: 16
  image_size: 512
  optimizer:
    type: AdamW
    weight_decay: 0.01
  scheduler:
    type: cosine
    warmup_steps: 500
  loss_function: 
    type: cross_entropy
  logging:
    log_interval: 100
    save_model: true
    save_interval: 1
  evaluation:
    metrics:
      - FID
      - KID
      - CLIP-Score
    eval_interval: 5000
    eval_samples: 1000
  dataset:
    train:
      path: data/processed/train_data.json
      num_samples: 10000
    val:
      path: data/processed/val_data.json
      num_samples: 2000